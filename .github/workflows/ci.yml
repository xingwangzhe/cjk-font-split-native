name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: bun install --frozen-lockfile
      - run: cargo test --locked
      - run: bun run format:check
      - run: bun run lint
      - run: bun run build:ts
      - run: bun run typecheck
      - run: cargo clippy --locked -- -D warnings
      - run: bun run build
      - run: bun run test
      - run: bun run benchmark
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            args: ''
          - host: macos-latest
            target: aarch64-apple-darwin
            args: ''
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            args: -x
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: --use-napi-cross
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - run: bun install --frozen-lockfile
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'linux')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'linux')
        with:
          tool: cargo-zigbuild
      - name: Build PGO release with matching C and C++ sysroot
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *-linux-gnu ]]; then
            bun run build:pgo --select --require-pgo --target "${{ matrix.target }}" --zig-glibc 2.28
          else
            bun run build:pgo --select --require-pgo --target ${{ matrix.target }} ${{ matrix.args }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: pgo-${{ matrix.target }}
          path: |
            target/pgo/${{ matrix.target }}/build.json
            target/pgo/${{ matrix.target }}/benchmark.json
          if-no-files-found: error
      - name: Reject accidental host glibc C23 imports
        if: contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          if objdump -T cjk-font-split-native.*.node | grep -q '__isoc23_'; then
            echo 'Native addon imported host glibc C23 functions instead of the release sysroot'
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.target }}
          path: cjk-font-split-native.*.node
          if-no-files-found: error
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build:ts
      - run: bun run typecheck
      - uses: actions/download-artifact@v8
        with:
          name: addon-${{ matrix.target }}
          path: .
      - if: ${{ !matrix.musl }}
        run: bun run test
      - name: Test GNU addon on older glibc and Node 22
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: docker run --rm -v "$PWD:/work" -w /work node:22-bullseye node --experimental-strip-types --test test/native.test.mts
      - if: matrix.musl
        run: docker run --rm -v "$PWD:/work" -w /work node:24-alpine node --experimental-strip-types --test test/native.test.mts
  performance:
    name: Compare runtime against 0.4.9 and previous candidate
    permissions:
      contents: read
      actions: read
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: addon-x86_64-unknown-linux-gnu
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          name: addon-x86_64-unknown-linux-gnu
          run-id: 37591881431
          github-token: ${{ github.token }}
          path: previous-candidate
      - name: Fetch pinned real CJK font
        shell: bash
        run: |
          mkdir -p benchmark-fonts
          curl --fail --location --retry 3 https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Regular.ttf -o benchmark-fonts/LXGWWenKai-Regular.ttf
          echo '39ad71264b588165b469e35e6afb162a378dacd1f95348160240ba9038ac3009  benchmark-fonts/LXGWWenKai-Regular.ttf' | sha256sum --check
      - name: Fetch published baseline and compare in one runner
        shell: bash
        env:
          CJK_BENCH_FONT: ${{ github.workspace }}/benchmark-fonts/LXGWWenKai-Regular.ttf
        run: |
          mkdir -p target/runtime-comparison baseline-package
          npm pack @xingwangzhe/cjk-font-split-native@0.4.9 --ignore-scripts --pack-destination baseline-package
          tar -xzf baseline-package/*.tgz -C baseline-package
          cp baseline-package/package/cjk-font-split-native.linux-x64-gnu.node target/runtime-comparison/baseline.node
          cp candidate/cjk-font-split-native.linux-x64-gnu.node target/runtime-comparison/optimized.node
          node -e "require('node:fs').writeFileSync('target/runtime-comparison/build.json', JSON.stringify({baseline: 'npm 0.4.9', candidate: process.env.GITHUB_SHA}))"
          node scripts/compare-pgo.mjs target/runtime-comparison
          mkdir -p target/previous-comparison
          cp previous-candidate/cjk-font-split-native.linux-x64-gnu.node target/previous-comparison/baseline.node
          cp candidate/cjk-font-split-native.linux-x64-gnu.node target/previous-comparison/optimized.node
          node -e "require('node:fs').writeFileSync('target/previous-comparison/build.json', JSON.stringify({baseline: 'e39eff4 / CI 37591881431', candidate: process.env.GITHUB_SHA}))"
          node scripts/compare-pgo.mjs target/previous-comparison
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-vs-0.4.9
          path: |
            target/runtime-comparison/*.json
            target/previous-comparison/*.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, test, performance]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: npm install --global npm@11.15.0
      - run: bun run build:ts
      - run: bun run typecheck
      - uses: actions/download-artifact@v8
        with:
          pattern: addon-*
          path: native-artifacts
          merge-multiple: true
      - run: cp native-artifacts/*.node .
      - name: Verify release version matches tag
        run: |
          PACKAGE_VERSION=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"
      - name: Pack and publish all platform binaries
        run: |
          bun pm pack --dry-run
          npm publish --access public --tag latest
