[package]
name = "cjk-font-split-native"
version = "0.4.9"
edition = "2021"
authors = ["xingwangzhe <xingwangzhe@outlook.com>"]
license = "MIT"
description = "Native multilingual font subsetting for Vite"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = "1.8.7"
allsorts = { version = "0.17.0", default-features = false, features = ["flate2_rust"] }
hb_subset = { package = "mkwebfont_hb-subset", version = "0.5.0" }
napi = { version = "3.13.0", features = ["napi3"] }
napi-derive = "3.6.9"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
woofwoof = "1.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"

[patch.crates-io]
woofwoof = { path = "vendor/woofwoof" }
mkwebfont_hb-subset = { path = "vendor/hb-subset" }
